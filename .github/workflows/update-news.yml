name: Update AI News Snapshot

on:
  workflow_dispatch:
    inputs:
      force_tikhub:
        description: "Force TikHub refresh (requires explicit TIKHUB_ENABLED=1 and a key)"
        required: false
        default: false
        type: boolean
  push:
    branches: [master]
    paths:
      - '.github/workflows/update-news.yml'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - 'feeds/follow.example.opml'
      - 'personas/**'
  schedule:
    # Nuos fork: hourly, away from the crowded start of the hour. All times UTC.
    - cron: '17 * * * *'

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

env:
  RADAR_SITE_URL: https://nuos.github.io/ai-news-radar

jobs:
  update:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run regression tests
        if: github.event_name != 'schedule'
        run: |
          python -m py_compile scripts/update_news.py scripts/persona_score.py scripts/generate_feed.py scripts/fork_setup.py
          python -m pytest -q
          node --check assets/app.js

      - name: Configure this fork
        run: python scripts/fork_setup.py configure --site-url "$RADAR_SITE_URL" --repository "$GITHUB_REPOSITORY"

      - name: Prepare OPML
        env:
          FOLLOW_OPML_B64: ${{ secrets.FOLLOW_OPML_B64 }}
        run: |
          mkdir -p feeds
          if [ -n "$FOLLOW_OPML_B64" ]; then
            printf '%s' "$FOLLOW_OPML_B64" | base64 --decode > feeds/follow.opml
            echo 'Loaded private OPML from repository secret; contents are not logged'
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo 'Using public example OPML'
          fi

      - name: Update data
        env:
          # This public deployment never reads or publishes private mail.
          EMAIL_DIGEST_ENABLED: '0'
          AGENTMAIL_RESOLVE_PUBLIC_URLS: '0'
          EMAIL_DIGEST_INCLUDE_IN_RADAR: '0'
          EMAIL_DIGEST_PUBLISH: '0'
          # Paid adapters require explicit opt-in; a key alone cannot enable them.
          X_API_ENABLED: ${{ vars.X_API_ENABLED || '0' }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          SOCIALDATA_ENABLED: ${{ vars.SOCIALDATA_ENABLED || '0' }}
          SOCIALDATA_API_KEY: ${{ secrets.SOCIALDATA_API_KEY }}
          SOCIALDATA_QUERY: ${{ vars.SOCIALDATA_QUERY }}
          SOCIALDATA_SEARCH_TYPE: ${{ vars.SOCIALDATA_SEARCH_TYPE }}
          SOCIALDATA_MAX_RESULTS: ${{ vars.SOCIALDATA_MAX_RESULTS }}
          SOCIALDATA_DAILY_TWEET_LIMIT: ${{ vars.SOCIALDATA_DAILY_TWEET_LIMIT }}
          SOCIALDATA_RUN_INTERVAL_HOURS: ${{ vars.SOCIALDATA_RUN_INTERVAL_HOURS }}
          SOCIALDATA_RUN_UTC_HOUR: ${{ vars.SOCIALDATA_RUN_UTC_HOUR }}
          SOCIALDATA_RUN_UTC_MINUTE_MAX: ${{ vars.SOCIALDATA_RUN_UTC_MINUTE_MAX }}
          SOCIALDATA_LIST_ID: ${{ vars.SOCIALDATA_LIST_ID }}
          SOCIALDATA_LIST_ENABLED: ${{ vars.SOCIALDATA_LIST_ENABLED }}
          SOCIALDATA_LIST_MAX_RESULTS: ${{ vars.SOCIALDATA_LIST_MAX_RESULTS }}
          SOCIALDATA_LIST_EXCLUDE: ${{ vars.SOCIALDATA_LIST_EXCLUDE }}
          TIKHUB_ENABLED: ${{ vars.TIKHUB_ENABLED || '0' }}
          TIKHUB_API_KEY: ${{ secrets.TIKHUB_API_KEY }}
          TIKHUB_API_BASE_URL: ${{ vars.TIKHUB_API_BASE_URL }}
          TIKHUB_QUERY: ${{ vars.TIKHUB_QUERY }}
          TIKHUB_PLATFORMS: ${{ vars.TIKHUB_PLATFORMS }}
          TIKHUB_MAX_RESULTS: ${{ vars.TIKHUB_MAX_RESULTS }}
          TIKHUB_DAILY_ITEM_LIMIT: ${{ vars.TIKHUB_DAILY_ITEM_LIMIT }}
          TIKHUB_RUN_INTERVAL_HOURS: ${{ vars.TIKHUB_RUN_INTERVAL_HOURS }}
          TIKHUB_RUN_UTC_HOUR: ${{ vars.TIKHUB_RUN_UTC_HOUR }}
          TIKHUB_RUN_UTC_MINUTE_MAX: ${{ vars.TIKHUB_RUN_UTC_MINUTE_MAX }}
          TIKHUB_FORCE_RUN: ${{ inputs.force_tikhub && '1' || '' }}
          RSS_MAX_FEEDS: ${{ vars.RSS_MAX_FEEDS || '10' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE_URL: ${{ vars.DEEPSEEK_API_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          TITLE_ENHANCE_MAX_PER_RUN: ${{ vars.TITLE_ENHANCE_MAX_PER_RUN }}
        run: |
          if [ -f feeds/follow.opml ]; then
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21 --rss-opml feeds/follow.opml --rss-max-feeds "${RSS_MAX_FEEDS:-10}"
          else
            python scripts/update_news.py --output-dir data --window-hours 24 --archive-days 21
          fi

      - name: Persona scoring
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE_URL: ${{ vars.DEEPSEEK_API_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: python scripts/persona_score.py --data-dir data

      - name: Generate RSS feed
        run: python scripts/generate_feed.py --data-dir data

      - name: Validate generated snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('latest-24h.json', 'daily-brief.json', 'source-status.json', 'stories-merged.json'):
              data = json.loads((Path('data') / name).read_text(encoding='utf-8'))
              if not isinstance(data, dict) or not data.get('generated_at'):
                  raise SystemExit(f'Invalid generated snapshot: {name}')
          latest = json.loads(Path('data/latest-24h.json').read_text(encoding='utf-8'))
          if int(latest.get('total_items', 0)) <= 0:
              raise SystemExit('Empty snapshot; refusing to publish')
          print('Snapshot:', latest['generated_at'], 'items:', latest['total_items'])
          PY

      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/ README.md index.html classic/index.html scripts/generate_feed.py skills/radar/SKILL.md .nojekyll
          if git ls-files --error-unmatch CNAME >/dev/null 2>&1; then
            git add -u -- CNAME
          fi
          if [ -n "$(git status --porcelain --untracked-files=all -- data/ | grep -v '^[MADRC]' || true)" ]; then
            echo '::error::Generated data files remain unstaged'
            git status --porcelain --untracked-files=all -- data/
            exit 1
          fi
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'chore: update Nuos AI news snapshot and site configuration'
          for attempt in 1 2 3; do
            git push && exit 0
            echo "Push rejected (attempt $attempt); rebasing onto current branch"
            git pull --rebase origin "$GITHUB_REF_NAME" || { git rebase --abort || true; exit 1; }
          done
          git push

      - name: Rebuild GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN data commits do not automatically trigger a Pages build.
          gh api "repos/$GITHUB_REPOSITORY/pages" --jq '{url: .html_url, source: .source, cname: .cname}'
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.status'

      - name: Verify published site and fresh data
        timeout-minutes: 6
        run: python scripts/fork_setup.py verify --site-url "$RADAR_SITE_URL"
